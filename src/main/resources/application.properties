server.port=${PORT:8080}
management.endpoints.web.exposure.include=health

spring.servlet.multipart.max-file-size=26MB
spring.servlet.multipart.max-request-size=26MB

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.access-password=${APP_PASSWORD:}
app.admin-password=${ADMIN_PASSWORD:}

google.service-account-json=${GOOGLE_SERVICE_ACCOUNT_JSON:}
google.spreadsheet-id=${SPREADSHEET_ID:}
google.drive-folder-id=${DRIVE_FOLDER_ID:}

google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
google.oauth.refresh-token=${GOOGLE_OAUTH_REFRESH_TOKEN:}
